name: Atualizar produtos da Shopee

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  atualizar-produtos:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        working-directory: automacao
        run: npm install

      - name: Executar automação
        working-directory: automacao
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: node index.js

      - name: Salvar produtos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add automacao/produtos.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos produtos."
          else
            git commit -m "Atualizar produtos da Shopee"
            git push
          fi