
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Obrigado — BombaNet</title>

  <meta name="description" content="Mensagem enviada com sucesso para a BombaNet.">

  <link rel="icon" type="image/png" href="img/bomba-redimensionado-para-pequenosemfundo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f7f6f3;
      color: #14213a;
      font-family: "Inter", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 620px;
      text-align: center;
      background: #ffffff;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(20, 33, 58, 0.08);
    }

    .logo {
      display: inline-block;
      margin-bottom: 30px;
      color: #14213a;
      font-family: "Newsreader", serif;
      font-size: 42px;
      font-weight: 700;
      text-decoration: none;
    }

    .logo-dot {
      color: #c9a34a;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #14213a;
      color: #c9a34a;
      font-size: 34px;
      font-weight: 700;
    }

    h1 {
      margin-bottom: 15px;
      font-family: "Newsreader", serif;
      font-size: 42px;
      line-height: 1.1;
    }

    p {
      margin-bottom: 30px;
      color: #5f6672;
      font-size: 16px;
      line-height: 1.7;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 8px;
      background: #14213a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    @media (max-width: 600px) {
      .container {
        padding: 45px 25px;
      }

      .logo {
        font-size: 36px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <a href="/" class="logo">
      BombaNet<span class="logo-dot">.</span>
    </a>

    <div class="icon">✓</div>

    <h1>Mensagem enviada!</h1>

    <p>
      Obrigado pelo contato.
      Recebemos suas informações com sucesso.
    </p>

    <a href="/" class="btn">
      Voltar para a BombaNet
    </a>

  </main>

</body>
</html>
